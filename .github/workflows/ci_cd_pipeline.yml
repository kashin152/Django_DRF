name: Django_CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Запуск Flake8
        run: flake8 .

  tests:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: restdatabase
          POSTGRES_USER: rest_user
          POSTGRES_PASSWORD: rest_user_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rest_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          sudo apt-get update && sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -U rest_user; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done

      - name: Check PostgreSQL service
        run: |
          echo "Checking PostgreSQL service..."
          docker ps
          echo "PostgreSQL logs:"
          docker logs $(docker ps -q --filter ancestor=postgres:latest)

      - name: Run makemigrations
        run: |
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          poetry run python manage.py makemigrations

      - name: Run migrate
        env:
          NAME: restdatabase
          USER: rest_user
          PASSWORD: rest_user_password
          HOST: localhost
        run: |
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          poetry run python manage.py migrate

      - name: Run tests
        env:
          NAME: restdatabase
          USER: rest_user
          PASSWORD: rest_user_password
          HOST: localhost
        run: |
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          poetry run python manage.py test
          
  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Copy project files to server
        run: |
          rsync -avz --exclude '＿pycache＿' . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}}:${{ secrets.DEPLOY_DIR }}

      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            curl -sSL https://install.python-poetry.org | python3 -
            echo "$HOME/.local/bin" >> $GITHUB_PATH
            poetry install
          EOF

      - name: Apply migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            export PATH="/root/.local/bin:$PATH"
            python manage.py migrate
          EOF

      - name: Collect static files on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}G${{ secrets.SERVER_IP }}} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            export PATH="/root/.local/bin:$PATH"
            python manage.py collectstatic --noinput
          EOF

      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}G${{ secrets.SERVER_IP }}} << 'EOF'
            sudo systemctl restart django_drf.service
          EOF

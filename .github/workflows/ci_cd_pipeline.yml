name: Django_CI/CD
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Запуск Flake8
        run: flake8 .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Запуск Redis
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: "latest"
      - name: Установка Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Установка зависимостей
        run: poetry install --no-root
      - name: Создание env-файла
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          envkey_DEBUG: ${{ secrets.DEBUG }}
          envkey_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          envkey_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          envkey_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          envkey_POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          envkey_POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          envkey_STRIPE_API_KEY: ${{ secrets.SECRET_KEY_API }}
          envkey_REDIS_LOCATION: ${{ secrets.LOCATION }}
          envkey_EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          envkey_EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          envkey_EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          envkey_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          fail_on_empty: true
      - name: Запуск тестов
        run: poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: success()

    steps:
      - name: Настройка PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'rest_user_password';"
          sudo -u postgres psql -c "CREATE DATABASE restdatabase;"
          sudo -u postgres psql -c "CREATE ROLE runner WITH LOGIN PASSWORD 'rest_user_password';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE restdatabase TO runner;"
          sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO runner;"
          echo "DATABASE_URL=postgres://runner:rest_user_password@localhost/restdatabase" >> $GITHUB_ENV

      - name: Run makemigrations
        run: |
          poetry run python manage.py makemigrations

      - name: Run migrate
        run: |
          poetry run python manage.py migrate

      - name: Run tests
        run: |
          poetry run python manage.py test

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY}}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD}}
        run: |
          sshpass -p "pX^zc-bwLiB9BZ" ssh -v -o StrictHostKeyChecking=no ${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && git pull && poetry install && sudo systemctl restart nginx"

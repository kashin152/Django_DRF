name: Django_CI/CD
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Запуск Flake8
        run: flake8 .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          sudo apt-get update && sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-root
          

      - name: Настройка PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'rest_user_password';"
          sudo -u postgres psql -c "CREATE DATABASE restdatabase;"
          sudo -u postgres psql -c "CREATE ROLE runner WITH LOGIN PASSWORD 'rest_user_password';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE restdatabase TO runner;"
          sudo -u postgres psql -c "GRANT CREATE ON SCHEMA public TO runner;"
          echo "DATABASE_URL=postgres://runner:rest_user_password@localhost/restdatabase" >> $GITHUB_ENV

      - name: Run makemigrations
        run: |
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          poetry run python manage.py makemigrations

      - name: Run migrate
        run: |
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          poetry run python manage.py migrate

      - name: Run tests
        run: |
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          poetry run python manage.py test  

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa
          ssh-keyscan -H 94.103.12.183 >> /home/runner/.ssh/known_hosts
          sshpass -p "${{ secrets.ROOT_PASSWORD }}" ssh -v -o StrictHostKeyChecking=no root@94.103.12.183 "
            cd /root/Django_DRF && 
            git pull && 
            sudo apt-get update && 
            sudo apt-get install -y locales && 
            sudo locale-gen en_US.UTF-8 && 
            export LANG=en_US.UTF-8 && 
            curl -sSL https://install.python-poetry.org | python3 - && 
            export PATH=\"\$HOME/.local/bin:\$PATH\" && 
            poetry --version && 
            poetry install && 
            sudo systemctl restart nginx
          "


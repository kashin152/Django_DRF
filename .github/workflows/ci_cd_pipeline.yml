name: Django_CI/CD
on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8
            - name: Run Flake8
              run: flake8 .

    tests:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - name: Check out code
              uses: actions/checkout@v3
            - name: Set up python
              uses: actions/setup-python@v4
              with:
                python-version: "3.12"
            - name: Start redis
              uses: supercharge/redis-github-action@1.7.0
              with:
                  redis-version: "latest"
            - name: Install poetry
              uses: abatilo/actions-poetry@v2.1.4
            - name: Add Poetry to $PATH
              run: |
                python -m pip install --upgrade pip
                pip install poetry
            - name: Install dependencies
              run: |
                poetry install --no-interaction
            - name: Make envfile
              uses: SpicyPizza/create-envfile@v2.0
              with:
                  envkey_SECRET_KEY: ${{ secrets.SECRET_KEY }}
                  envkey_DEBUG: ${{ secrets.DEBUG }}
                  envkey_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                  envkey_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                  envkey_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  envkey_POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
                  envkey_POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
                  envkey_STRIPE_API_KEY: ${{ secrets.SECRET_KEY_API }}
                  envkey_REDIS_LOCATION: ${{ secrets.LOCATION }}
                  envkey_EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
                  envkey_EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
                  envkey_EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
                  envkey_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
                  fail_on_empty: true
            - name: Run migrations
              run: |
                source ${{ steps.pyenv.outputs.pyenv }}/activate
                python manage.py migrate
            - name: Run tests
              run: python manage.py test

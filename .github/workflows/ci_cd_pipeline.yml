name: Django_CI/CD
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Запуск Flake8
        run: flake8 .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Запуск Redis
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: "latest"
      - name: Установка Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Установка зависимостей
        run: poetry install
      - name: Создание env-файла
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          envkey_DEBUG: ${{ secrets.DEBUG }}
          envkey_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          envkey_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          envkey_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          envkey_POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          envkey_POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          envkey_STRIPE_API_KEY: ${{ secrets.SECRET_KEY_API }}
          envkey_REDIS_LOCATION: ${{ secrets.LOCATION }}
          envkey_EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          envkey_EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          envkey_EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          envkey_EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          fail_on_empty: true
      - name: Запуск тестов
        run: poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Настройка SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Копирование файлов проекта на сервер
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            mkdir -p ${{ secrets.DEPLOY_DIR }}
            cd ${{ secrets.DEPLOY_DIR }}
            if [ ! -d ".git" ]; then
              git clone https://github.com/kashin152/Django_DRF.git .
            else
              git pull
            fi
          EOF
      - name: Установка зависимостей на сервере
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            if ! command -v poetry &> /dev/null; then
              echo "Poetry не найден. Устанавливаем..."
              curl -sSL https://install.python-poetry.org | python3 -
            else
              echo "Poetry уже установлен."
            fi
            export PATH="$HOME/.local/bin:$PATH"
            echo "export PATH=\"$HOME/.local/bin:\$PATH\"" >> ~/.bashrc
            source ~/.bashrc
            cd ${{ secrets.DEPLOY_DIR }}
            poetry install --no-root
            export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          EOF
      - name: Применение миграций на сервере
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sudo -E apt-get update
          sudo -E apt-get install -y postgresql-client
          sudo -E service postgresql start
          sudo -E -u postgres psql -c "ALTER USER postgres PASSWORD '12345';"
          sudo -E -u postgres psql -c "CREATE DATABASE restdatabase;"
          sudo -E -u postgres psql -c "CREATE ROLE runner WITH LOGIN PASSWORD '12345';"
          sudo -E -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE restdatabase TO runner;"
          sudo -E -u postgres psql -c "GRANT CREATE ON SCHEMA public TO runner;"
          curl -sSL https://install.python-poetry.org | python3 -
          poetry run python3 manage.py makemigrations
          poetry run python3 manage.py migrate
      - name: Collect static files on server
        run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
              cd ${{ secrets.DEPLOY_DIR }}
              export PATH="/root/.local/bin:$PATH"
              poetry run python3 manage.py collectstatic --noinput
            EOF
      - name: Restart application
        run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
              sudo systemctl restart drf_project.service
            EOF
